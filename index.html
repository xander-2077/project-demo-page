<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f3">
    <meta name="description" content="XR Teleoperate — G1、B2 + Z1、H2、R1 机器人遥操作工作台">
    <title>XR Teleoperate · 遥操作工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23c57053'/%3E%3Cpath d='M11 12l18 16M29 12L11 28M20 8v24M8 20h24' stroke='%23fff8ed' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm0 9 9-4M3 8l9 4v9"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    </svg>

    <div class="page">
      <main>
        <section class="hero" aria-labelledby="page-title">
          <h1 id="page-title">让你的动作，<br class="mobile-break">延伸到远方。</h1>
          <div class="hero-decoration" aria-hidden="true"><div></div><div></div></div>
        </section>

        <section class="robots-section" aria-labelledby="robots-title">
          <div class="section-header">
            <div class="section-heading"><h2 id="robots-title">选择机器人</h2><span id="result-count">04</span></div>
            <label class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索机器人…" aria-label="搜索机器人" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
          </div>
          <div class="robot-grid" id="robot-grid"></div>
          <div class="empty-state" id="empty-state" hidden><svg class="icon"><use href="#i-search"/></svg><h3>暂时没有找到这个机器人</h3><p>试试 G1、B2 + Z1、H2 或 R1。</p><button class="text-button" id="clear-search">清除搜索</button></div>
        </section>

      </main>
    </div>

    <dialog id="robot-dialog" aria-labelledby="dialog-title">
      <button class="icon-button dialog-close" data-close aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
      <div class="dialog-robot" id="dialog-robot" aria-hidden="true"></div>
      <h2 id="dialog-title"></h2>
      <p class="dialog-description" id="dialog-description"></p>
      <label class="field-label" for="model-select">选择机器人型号</label>
      <select id="model-select"></select>
      <button class="primary-button confirm-selection" id="confirm-selection">选择此机器人<svg class="icon"><use href="#i-arrow"/></svg></button>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
